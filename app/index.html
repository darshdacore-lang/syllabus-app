<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>25:00 — Pomodoro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at top, #2a2a35, #0a0a0d);
            color: white;
            font-family: system-ui, sans-serif;

            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }

        /* Mode bar */
        .mode-bar {
            display: flex;
            gap: 10px;
            padding: 6px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Buttons */
        .mode-btn {
            padding: 7px 18px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: transparent;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .mode-btn:hover {
            color: white;
            border-color: rgba(255, 255, 255, 0.4);
        }

        .mode-btn.active {
            background: rgba(255, 255, 255, 0.12);
            color: white;
        }

        #timer {
            font-size: 110px;
            font-weight: 700;
            letter-spacing: -4px;
            font-variant-numeric: tabular-nums;

            background: linear-gradient(180deg, #ffffff, #b5b5b5);

            -webkit-background-clip: text;
            background-clip: text;

            -webkit-text-fill-color: transparent;

            display: inline-block;
        }

        /* STATUS */
        #status {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }

        /* BUTTONS */
        .buttons {
            display: flex;
            gap: 10px;
        }

        button.action {
            padding: 14px 30px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        button.action:active {
            transform: scale(0.97);
            opacity: 0.8;
        }

        .start {
            background: #22c55e;
            color: #052e16;
        }

        .pause {
            background: #f59e0b;
            color: #2d1a00;
        }

        .reset {
            background: #27272a;
            color: white;
        }

        .hud {
            position: fixed;
            top: 16px;
            left: 16px;
            padding: 14px 16px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            font-size: 12px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.85);
            box-shadow: 0 0 0 rgba(255, 255, 255, 0);
            transition: all 0.3s ease;
        }

        /* ← just one clean closing brace, remove the nested .hud block */
    </style>
</head>

<body>

    <h1>SYLLABUS-UI</h1>
    <div id="timer">25:00</div>

    <div id="task-list"></div>

    <form id="task-form">
        <input type="text" id="task-title" placeholder="Task Title">
        <input type="text" id="task-subject" placeholder="Subject">
        <input type="date" id="task-due-date">
        <input type="text" id="task-tags" placeholder="Tags (comma separated)">
        <textarea id="task-details" placeholder="Details"></textarea>
        <button type="button" onclick="handleAddTask()">Add Task</button>
    </form>

</body>
